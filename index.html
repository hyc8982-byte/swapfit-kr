<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스왑핏 · 아파도 운동은 바꿔서 한다</title>
<meta name="description" content="운동 부위와 아픈 곳을 고르면 지금 헬스장에서 바로 바꿔 할 대체 운동을 알려주는 스왑핏.">
<meta name="theme-color" content="#F2F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1216" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스왑핏">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="스왑핏">
<meta property="og:description" content="아파도 운동은 바꿔서 한다. 통증 부위별 대체 운동 찾기.">
<meta property="og:image" content="/icons/og.png">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}.app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 앱처럼 한 화면씩 — 1 부위 → 2 통증 → 3 결과(탭). 화면 높이 고정, 넘칠 때만 화면 안에서 스크롤. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --ink:#14202B; --muted:#5A6A79; --line:#D8E0E7;
  --tape:#1A78C2; --tape-soft:#E3F0FA; --tape-ink:#FFFFFF;
  --pain:#D63A72; --pain-soft:#FBE6EE;
  --ok:#1E8A55; --ok-soft:#E2F4EA; --warn:#B7790F; --warn-soft:#FBF0DA; --stop:#C7342F; --stop-soft:#FBE4E2;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1216; --surface:#171D23; --ink:#E7ECF1; --muted:#93A0AD; --line:#27313B;
  --tape:#4FB8F0; --tape-soft:#14303F; --tape-ink:#0B1621;
  --pain:#FF5C93; --pain-soft:#3A1A27;
  --ok:#4CC488; --ok-soft:#14301F; --warn:#E5AE45; --warn-soft:#352A12; --stop:#F0706A; --stop-soft:#3A1816;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1216; --surface:#171D23; --ink:#E7ECF1; --muted:#93A0AD; --line:#27313B;
  --tape:#4FB8F0; --tape-soft:#14303F; --tape-ink:#0B1621;
  --pain:#FF5C93; --pain-soft:#3A1A27;
  --ok:#4CC488; --ok-soft:#14301F; --warn:#E5AE45; --warn-soft:#352A12; --stop:#F0706A; --stop-soft:#3A1816;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2.5px solid var(--tape);outline-offset:2px}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px}
.bar{flex:none;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;height:52px}
.back{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:12px;font-size:26px;line-height:1;cursor:pointer;color:var(--ink)}
.back:disabled{visibility:hidden}
.steps{display:flex;justify-content:center;gap:6px}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--line);transition:background .2s}
.steps i.on{background:var(--tape)}
.screens{flex:1;position:relative;overflow:hidden;min-height:0}
.scr{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;padding-block:6px 20px;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;transform:translateX(105%);opacity:0;visibility:hidden}
.scr.on{transform:none;opacity:1;visibility:visible}
.scr.past{transform:translateX(-25%);opacity:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){.scr{transition:none}}
h1,h2{margin:0;text-wrap:balance}
h2{font-size:24px;line-height:1.3}
.kicker{font-size:13px;font-weight:700;color:var(--tape);letter-spacing:.04em}
/* 1 */
.hero{display:flex;align-items:center;gap:10px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.hero p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;grid-auto-rows:minmax(84px,1fr);max-height:420px}
.tile{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;transition:border-color .15s,transform .1s}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:var(--tape)}
.tile b{font-size:22px;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.tile em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--tape);background:var(--tape-soft);border-radius:999px;padding:2px 8px}
.note{font-size:11.5px;color:var(--muted);margin:0}
/* 2 */
.rows{display:flex;flex-direction:column;gap:10px}
.row{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left}
.row:hover{border-color:var(--pain)}
.row:active{transform:scale(.98)}
.row i{grid-row:span 2;width:12px;height:12px;border-radius:50%;background:var(--pain);box-shadow:0 0 0 5px var(--pain-soft)}
.row b{font-size:17px}
.row span{grid-column:2;font-size:13px;color:var(--muted)}
.row .chev{grid-row:1/span 2;grid-column:3;font-size:22px;color:var(--muted)}
/* 3 */
.r-title{display:flex;flex-direction:column;gap:2px}
.r-title h2{font-size:21px}
.pain{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pain-top{display:flex;justify-content:space-between;align-items:baseline}
.pain-top label{font-weight:700;font-size:14px}
.nrs{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.nrs small{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--tape);margin:0}
.verdict{border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.verdict .pill{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;color:var(--surface)}
.v-ok{background:var(--ok-soft)} .v-ok .pill{background:var(--ok)}
.v-warn{background:var(--warn-soft)} .v-warn .pill{background:var(--warn)}
.v-stop{background:var(--stop-soft)} .v-stop .pill{background:var(--stop)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:12px;padding:3px;gap:3px;position:sticky;top:0;z-index:2}
.tab{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.panel{display:flex;flex-direction:column;gap:14px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.avoid{display:flex;flex-wrap:wrap;gap:6px}
.avoid span{font-size:13px;border-radius:6px;padding:2px 8px;background:var(--stop-soft);text-decoration:line-through;text-decoration-color:var(--stop);text-decoration-thickness:1.5px}
.froms{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.froms::-webkit-scrollbar{display:none}
.from{appearance:none;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.from[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.alts{display:flex;flex-direction:column;gap:10px}
.alts.dim{opacity:.4;pointer-events:none}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.alt strong{font-size:16px;line-height:1.35}
.alt .best{font-size:11px;font-weight:700;background:var(--tape-soft);color:var(--tape);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.alt p{grid-column:1/-1;margin:0;color:var(--muted);font-size:13.5px}
.play{appearance:none;border:0;background:var(--tape);color:var(--tape-ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.play::before{content:"▶ ";font-size:10px}
.cause{background:var(--tape-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.red{border:1.5px solid var(--stop);background:var(--stop-soft);border-radius:14px;padding:12px 14px}
.red .lbl{color:var(--stop)}
.maps{display:flex;gap:8px}
.maps a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14.5px;border-radius:12px;padding:12px;background:var(--ink);color:var(--bg)}
.maps a.alt2{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.partner{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
/* 동작 시트 */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,7,9,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
@media (min-width:640px){.sheet{align-items:center}}
.sheet-card{width:100%;max-width:480px;max-height:100%;overflow:auto;background:#121518;color:#E8EBEE;border:1px solid #23292F;border-radius:20px;display:flex;flex-direction:column;gap:12px;padding:14px}
.sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-top h3{margin:0;font-size:18px;text-wrap:balance}
.sheet-top small{color:#8C949C;font-size:12.5px}
.x{appearance:none;border:0;background:#1E2328;color:#E8EBEE;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#0B0C0E;cursor:pointer}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:4/3}
.stage .pp{position:absolute;right:10px;top:10px;font-size:12px;color:#8C949C;background:#16191D;border-radius:999px;padding:3px 10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:#B9C0C7}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.sheet-desc{margin:0;font-size:14.5px;color:#C9CFD5}
.tempo{font-family:var(--f-mono);font-size:12.5px;color:#8C949C}
.yt{color:#8FD9FF;font-size:13.5px}
</style>

</head>
<body>
<div class="app">
 <header class="bar">
  <button class="back" id="back" aria-label="뒤로" disabled>‹</button>
  <div class="steps" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
  <span></span>
 </header>
 <main class="screens">
  <section class="scr on" id="s1" aria-label="운동 부위 선택">
   <div class="hero"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" aria-hidden="true" viewBox="0 0 512 512"><g transform="translate(0 0) scale(1.0)"><rect width="512" height="512" rx="116" fill="#0B0C0E"/><path d="M111.8 214.7 A150 150 0 0 1 367.5 155.6" fill="none" stroke="#FF4F8B" stroke-width="40" stroke-linecap="round"/><path d="M400.5 194.8 L404.6 131.3 L337.2 187.9 Z" fill="#FF4F8B" stroke="#FF4F8B" stroke-width="10" stroke-linejoin="round"/><path d="M400.2 297.3 A150 150 0 0 1 144.5 356.4" fill="none" stroke="#3FC8FF" stroke-width="40" stroke-linecap="round"/><path d="M111.5 317.2 L107.4 380.7 L174.8 324.1 Z" fill="#3FC8FF" stroke="#3FC8FF" stroke-width="10" stroke-linejoin="round"/><rect x="176" y="248" width="160" height="16" rx="8" fill="#F1F3F5"/><rect x="186" y="208.0" width="28" height="96" rx="9" fill="#F1F3F5"/><rect x="298" y="208.0" width="28" height="96" rx="9" fill="#F1F3F5"/><rect x="160" y="224.0" width="20" height="64" rx="9" fill="#F1F3F5"/><rect x="332" y="224.0" width="20" height="64" rx="9" fill="#F1F3F5"/></g></svg><div><h1>스왑핏</h1><p>아파도 운동은 바꿔서 한다</p></div></div>
   <div><div class="kicker">STEP 1</div><h2>오늘 어디 운동해요?</h2></div>
   <div class="tiles" id="tiles"></div>
   <p class="note">운동 선택을 돕는 참고 정보이고, 의학적 진단이나 치료를 대신하지 않아요.</p>
  </section>
  <section class="scr" id="s2" aria-label="통증 부위 선택">
   <div><div class="kicker">STEP 2</div><h2 id="s2t"></h2></div>
   <div class="rows" id="rows"></div>
  </section>
  <section class="scr" id="s3" aria-label="대체 운동"></section>
 </main>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-name">
 <div class="sheet-card">
  <div class="sheet-top"><div><small id="sh-from"></small><h3 id="sh-name"></h3></div><button class="x" id="sh-close" aria-label="닫기">×</button></div>
  <div class="stage" id="stage"><canvas id="cv" width="640" height="480" aria-label="동작 애니메이션"></canvas><span class="pp" id="pp">탭해서 멈춤</span></div>
  <div class="legend"><span><i style="background:#3FC8FF"></i><b id="sh-mus"></b> 자극</span><span id="sh-painl"><i style="background:#FF4F8B"></i><span id="sh-pain"></span> 통증 부위 (부담 적은 동작)</span></div>
  <p class="sheet-desc" id="sh-desc"></p>
  <div class="tempo">템포  1초 힘주기 · 0.4초 정지 · 1.4초 돌아오기</div>
  <a class="yt" id="sh-yt" target="_blank" rel="noopener">실제 영상으로도 보기 (유튜브 검색)</a>
 </div>
</div>
<script>
/* ===== 쫄라맨 동작 엔진 ===== */
const SEG={tor:62,ua:34,fa:32,th:46,sh:44};
const COL={bg:"#0B0C0E",body:"#F1F3F5",far:"#7C838B",prop:"#3A4048",cable:"#59636D",hi:"#3FC8FF",pain:"#FF4F8B",txt:"#8C949C"};
const rad=d=>d*Math.PI/180;
const lerp=(a,b,t)=>a+(b-a)*t;
function ik(root,tgt,l1,l2,bend){
  let dx=tgt[0]-root[0],dy=tgt[1]-root[1],d=Math.hypot(dx,dy);
  const base=Math.atan2(dy,dx);
  d=Math.max(Math.abs(l1-l2)+0.5,Math.min(l1+l2-0.3,d));
  const a=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const ang=base+bend*a;
  const mid=[root[0]+l1*Math.cos(ang),root[1]+l1*Math.sin(ang)];
  const end=[root[0]+d*Math.cos(base),root[1]+d*Math.sin(base)];
  return [mid,end];
}
function lerpPose(A,B,t){
  const o={};
  for(const k of new Set([...Object.keys(A),...Object.keys(B)])){
    const a=A[k],b=B[k]===undefined?a:B[k];
    if(a===undefined){o[k]=b;continue}
    if(typeof a==="number")o[k]=lerp(a,b,t);
    else if(Array.isArray(a))o[k]=a.map((v,i)=>lerp(v,b[i],t));
    else if(a&&typeof a==="object")o[k]=lerpPose(a,b,t);
    else o[k]=t<.5?a:b;
  }
  return o;
}
function limb(root,anchor,spec,l1,l2){
  if(!spec)return null;
  let t=spec.t?spec.t:[anchor[0]+spec.r[0],anchor[1]+spec.r[1]];
  if(spec.k)return [root,spec.k,t];
  const [m,e]=ik(root,t,l1,l2,spec.b||1);
  return [root,m,e];
}
function solve(T,p){
  const face=T.face||1;
  const hip=p.hip, a=rad(p.tor), dir=[Math.cos(a),Math.sin(a)];
  const sh=[hip[0]+SEG.tor*dir[0],hip[1]+SEG.tor*dir[1]];
  const head=[hip[0]+(SEG.tor+16)*dir[0],hip[1]+(SEG.tor+16)*dir[1]];
  const front=face===1?[-dir[1],dir[0]]:[dir[1],-dir[0]];
  const S={hip,sh,head,dir,front,face,view:T.view||"side"};
  if(S.view==="front"){
    const cx=hip[0];
    S.shR=[sh[0]+22,sh[1]+2];S.shL=[sh[0]-22,sh[1]+2];
    S.hipR=[hip[0]+9,hip[1]-2];S.hipL=[hip[0]-9,hip[1]-2];
    const mir=s=>s&&({...s,t:s.t?[2*cx-s.t[0],s.t[1]]:undefined,r:s.r?[-s.r[0],s.r[1]]:undefined,k:s.k?[2*cx-s.k[0],s.k[1]]:undefined,b:-(s.b||1)});
    S.armR=limb(S.shR,S.shR,p.arm,SEG.ua,SEG.fa);
    S.armL=limb(S.shL,S.shL,mir(p.arm),SEG.ua,SEG.fa);
    S.legR=limb(S.hipR,S.hipR,p.leg,SEG.th,SEG.sh);
    S.legL=limb(S.hipL,S.hipL,mir(p.leg),SEG.th,SEG.sh);
  }else{
    S.arm=limb(sh,sh,p.arm,SEG.ua,SEG.fa);
    S.arm2=limb(sh,sh,p.arm2,SEG.ua,SEG.fa);
    S.leg=limb(hip,hip,p.leg,SEG.th,SEG.sh);
    S.leg2=limb(hip,hip,p.leg2,SEG.th,SEG.sh);
  }
  S.p=p;
  return S;
}
function line(c,a,b,w,col){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}
function poly(c,pts,w,col){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const q of pts.slice(1))c.lineTo(q[0],q[1]);c.stroke()}
function footOf(c,S,leg,col,p){
  if(!leg)return;
  const [h,k,an]=leg;let ang;
  if(p.ft!==undefined)ang=rad(p.ft);
  else{const dx=an[0]-k[0],dy=an[1]-k[1];const sd=Math.atan2(dy,dx);ang=sd-(S.face===1?Math.PI/2:-Math.PI/2)}
  line(c,an,[an[0]+11*Math.cos(ang),an[1]+11*Math.sin(ang)],5,col);
}
function hand(c,T,pt,col){
  if(!pt)return;
  if(T.hand==="db"){c.fillStyle=COL.prop;c.strokeStyle="#5A626B";c.lineWidth=2;c.beginPath();c.arc(pt[0],pt[1],6.5,0,7);c.fill();c.stroke()}
  else if(T.hand==="handle"){c.strokeStyle="#5A626B";c.lineWidth=3;c.beginPath();c.arc(pt[0],pt[1],5,0,7);c.stroke()}
}
function seg(S,name){
  const {hip,sh,dir,front}=S;
  const at=(f,off)=>[hip[0]+dir[0]*SEG.tor*f+front[0]*off,hip[1]+dir[1]*SEG.tor*f+front[1]*off];
  return {at};
}
function painPoint(S,where){
  const v=S.view==="front";
  const arm=v?S.armR:S.arm, leg=v?S.legR:S.leg;
  const {at}=seg(S);
  switch(where){

function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function phaseT(time){ // 0..3s 루프: 힘주기 1.0s, 정지 .4s, 돌아오기 1.4s, 정지 .2s
  const t=time%3;
  if(t<1)return ease(t);if(t<1.4)return 1;if(t<2.8)return 1-ease((t-1.4)/1.4);return 0;
}
function render(c,key,pain,time,tFixed){
  const Tm=T[key];
  const t=tFixed!==undefined?tFixed:phaseT(time);
  const p=lerpPose(Tm.A,{...Tm.A,...Tm.B},t);
  const S=solve(Tm,p);
  c.fillStyle=COL.bg;c.fillRect(0,0,320,240);
  floor(c);
  Tm.props&&Tm.props(c,S);
  drawFigure(c,Tm,S,pain,time);
}

}
window.addEventListener("popstate",e=>{const sh=document.getElementById("sheet");if(sh&&!sh.hidden){sh.hidden=true;cancelAnimationFrame(anim.raf)}const s=(e.state&&e.state.step)||1;go(s,false)});
$("#back").addEventListener("click",()=>{if(history.state&&history.state.step>1){try{history.back();return}catch(e){}}go(state.step-1,false)});
$("#tiles").addEventListener("click",e=>{const b=e.target.closest(".tile");if(!b)return;state.part=b.dataset.id;go(2)});
$("#rows").addEventListener("click",e=>{const b=e.target.closest(".row");if(!b)return;state.pain=b.dataset.id;state.tab="swap";state.sw=0;go(3)});
$("#s3").addEventListener("click",e=>{
 const t=e.target.closest(".tab");if(t){state.tab=t.dataset.t;renderS3();return}
 const f=e.target.closest(".from");if(f){state.sw=+f.dataset.i;renderS3();return}
 const p=e.target.closest(".play");if(p)openSheet(state.sw,+p.dataset.i);
});
$("#s3").addEventListener("input",e=>{
 if(e.target.id!=="nrs")return;state.nrs=+e.target.value;const v=vOf(state.nrs);
 $("#nrsv").innerHTML=`${state.nrs}<small> / 10</small>`;
 const el=$("#verdict");el.className="verdict "+v.cls;el.innerHTML=`<span class="pill">${v.pill}</span><span>${v.txt}</span>`;
 const a=$("#alts");if(a)a.classList.toggle("dim",state.nrs>=7);
});
renderS1();
try{const h=location.hash.slice(1).split("--");if(DATA[h[0]]){state.part=h[0];if(DATA[h[0]].some(p=>p.id===h[1])){state.pain=h[1];go(3,false)}else go(2,false)}}catch(e){}

const sheet=$("#sheet"),cv=$("#cv"),cx=cv.getContext("2d");cx.setTransform(2,0,0,2,0,0);
let anim={key:null,pain:null,raf:0,t0:0,paused:false,pt:0,last:null};
function frame(ts){const time=anim.paused?anim.pt:(ts-anim.t0)/1000;anim.pt=time;render(cx,anim.key,anim.pain,time);anim.raf=requestAnimationFrame(frame)}
function openSheet(si,i){
 const d=DATA[state.part].find(p=>p.id===state.pain),sw=d.swaps[si],t=sw.to[i];
 const key=templateFor(t[0],state.part);if(!key)return;
 anim.key=key;anim.pain=PAIN_AT[d.id]||null;anim.paused=false;anim.t0=performance.now();
 $("#sh-from").textContent=sw.from+" 대신";$("#sh-name").textContent=t[0];$("#sh-desc").textContent=t[1];
 $("#sh-mus").textContent=(T[key].mus||[]).map(m=>MUS_KO[m]).join(" · ");
 $("#sh-pain").textContent=d.name;$("#sh-yt").href=yt(t[0]);$("#pp").textContent="탭해서 멈춤";
 anim.last=document.activeElement;sheet.hidden=false;cancelAnimationFrame(anim.raf);anim.raf=requestAnimationFrame(frame);$("#sh-close").focus();
}
function closeSheet(){sheet.hidden=true;cancelAnimationFrame(anim.raf);if(anim.last)anim.last.focus()}
$("#sh-close").addEventListener("click",closeSheet);
sheet.addEventListener("click",e=>{if(e.target===sheet)closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});
$("#stage").addEventListener("click",()=>{if(anim.paused){anim.paused=false;anim.t0=performance.now()-anim.pt*1000;$("#pp").textContent="탭해서 멈춤"}else{anim.paused=true;$("#pp").textContent="탭해서 재생"}});
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script>
</body>
